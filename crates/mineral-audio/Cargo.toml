[package]
name        = "mineral-audio"
description = "音频播放引擎(Symphonia + CPAL)"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
rust-version.workspace = true

[dependencies]
mineral-common = { workspace = true }
mineral-log          = { workspace = true }
mineral-model        = { workspace = true }
mineral-playback     = { workspace = true }

thiserror       = { workspace = true }
derive-getters  = { workspace = true }
parking_lot     = { workspace = true }
ringbuf         = { workspace = true }
cpal            = { workspace = true }
rubato          = { workspace = true }
audioadapter-buffers = { workspace = true }
spin            = { workspace = true }
serde           = { workspace = true, features = ["rc"] }
symphonia       = { workspace = true, features = ["mpa", "aac", "alac", "aiff", "adpcm", "flac", "ogg", "vorbis", "wav", "pcm"] }
tokio           = { workspace = true }
tokio-util      = { workspace = true }
typed-builder   = { workspace = true }

[dev-dependencies]
color-eyre   = { workspace = true }
mineral-test = { workspace = true }
proptest     = { workspace = true }
tempfile     = "3"

[lints]
workspace = true
