[package]
name        = "mineral-script"
description = "daemon 音乐回调与 TUI 本地脚本的独立 Lua 执行宿主"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
rust-version.workspace = true

[dependencies]
mineral-channel-core = { workspace = true }
mineral-log      = { workspace = true }
mineral-model    = { workspace = true }
mineral-paths    = { workspace = true }
mineral-protocol = { workspace = true }

thiserror      = { workspace = true }
derive-getters = { workspace = true }
mlua           = { workspace = true }
# workspace 统一声明只开 signal;sys.rs 取主机名需要 hostname(features 可加性合并)。
nix            = { workspace = true, features = ["hostname"] }
parking_lot    = { workspace = true }
rustc-hash     = { workspace = true }
serde_json    = { workspace = true }
tokio          = { workspace = true }
typed-builder  = { workspace = true }

[dev-dependencies]
mineral-config    = { workspace = true }
color-eyre       = { workspace = true }
mineral-test      = { workspace = true }
proptest          = { workspace = true }

[lints]
workspace = true
