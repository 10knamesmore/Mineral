[package]
name        = "mineral-client"
description = "Mineral 与传输无关的 client 会话核心:请求合批、结果配对、状态镜像与 PCM 窗口"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
rust-version.workspace = true

[dependencies]
mineral-audio        = { workspace = true }
mineral-channel-core = { workspace = true }
mineral-log          = { workspace = true }
mineral-model        = { workspace = true }
mineral-protocol     = { workspace = true }
mineral-task         = { workspace = true }

parking_lot    = { workspace = true }
rustc-hash     = { workspace = true }
tokio          = { workspace = true }
tokio-util     = { workspace = true }

[dev-dependencies]
async-trait        = { workspace = true }
color-eyre         = { workspace = true }
mineral-test       = { workspace = true }
serde_json         = { workspace = true }
tempfile           = "3"
tracing            = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }

[lints]
workspace = true
