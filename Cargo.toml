[workspace]
members = [
    "crates/mineral",
    "crates/mineral-audio",
    "crates/mineral-cli",
    "crates/mineral-log",
    "crates/mineral-task",
    "crates/mineral-tui",
    "crates/mineral-model",
    "crates/mineral-macros",
    "crates/mineral-config-macros",
    "crates/mineral-media",
    "crates/mineral-playback",
    "crates/mineral-paths",
    "crates/mineral-protocol",
    "crates/mineral-server",
    "crates/mineral-spectrum",
    "crates/mineral-test",
    "crates/mineral-channel/core",
    "crates/mineral-channel/netease",
    "crates/mineral-channel/bilibili",
    "crates/mineral-channel/mineral",
    "crates/mineral-channel/local",
    "crates/mineral-client",
    "crates/mineral-persist",
    "crates/mineral-config",
    "crates/mineral-script",
    "crates/mineral-stats",
]
resolver = "2"

[workspace.metadata]
name = "mineral"

[workspace.metadata.dylint]
libraries = [{ path = "tooling/lints" }]

[workspace.package]
version     = "0.5.9"
edition     = "2024"
license     = "MIT"
repository  = "https://github.com/10knamesmore/Mineral"
authors     = ["wanger <310779211wym@gmail.com>"]
rust-version = "1.96"

[workspace.dependencies]
arboard            = { version = "3.6", default-features = false }
color-eyre         = "0.6"
base64             = "0.22"
bincode            = "1.3"
bytes              = "1"
compact_str        = "0.8"
criterion          = { version = "0.5", features = ["async_tokio"] }
crossterm          = { version = "0.29", features   = ["event-stream"] }
derive-getters     = "0.5"
derive_setters     = "0.1"
fast_image_resize  = { version = "6.1", default-features = false, features = ["image"] }
futures-util       = "0.3"
hex                = "0.4"
sha2               = "0.10"
image              = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jpeg-decoder       = { version = "0.3.2", default-features = false, features = ["nightly_aarch64_neon"] }
icy_sixel          = "0.1.3"
isahc              = { version = "1.7", features    = ["cookies"] }
libc               = "0.2"
nix                = { version = "0.29", features = ["fs", "mman", "poll", "signal"] }
lofty              = "0.22"
symphonia          = { version = "0.5", default-features = false, features = ["isomp4"] }
mlua               = { version = "0.10", features = ["lua54", "vendored", "serialize", "send"] }
mineral-audio           = { path = "crates/mineral-audio" }
mineral-cli             = { path = "crates/mineral-cli" }
mineral-log             = { path = "crates/mineral-log" }
mineral-task            = { path = "crates/mineral-task" }
mineral-tui             = { path = "crates/mineral-tui", default-features = false }
mineral-macros          = { path = "crates/mineral-macros" }
mineral-config-macros   = { path = "crates/mineral-config-macros" }
mineral-media           = { path = "crates/mineral-media" }
mineral-playback        = { path = "crates/mineral-playback" }
mineral-model           = { path = "crates/mineral-model" }
mineral-paths           = { path = "crates/mineral-paths" }
mineral-protocol        = { path = "crates/mineral-protocol" }
mineral-server          = { path = "crates/mineral-server" }
mineral-spectrum        = { path = "crates/mineral-spectrum" }
mineral-test            = { path = "crates/mineral-test" }
mineral-channel-core    = { path = "crates/mineral-channel/core" }
mineral-channel-netease = { path = "crates/mineral-channel/netease" }
mineral-channel-bilibili = { path = "crates/mineral-channel/bilibili" }
mineral-channel-mineral = { path = "crates/mineral-channel/mineral" }
mineral-channel-local = { path = "crates/mineral-channel/local" }
mineral-client          = { path = "crates/mineral-client" }
mineral-persist         = { path = "crates/mineral-persist" }
mineral-config          = { path = "crates/mineral-config" }
mineral-script          = { path = "crates/mineral-script" }
mineral-stats           = { path = "crates/mineral-stats" }
uuid               = { version = "1", features = ["v4"] }
syn                = { version = "2", features = ["full"] }
quote              = "1"
async-trait        = "0.1"
thiserror          = "1"
regex              = "1"
flate2             = "1"
num-bigint         = "0.4"
num-traits         = "0.2"
aes                = "0.8"
cbc                = "0.1"
ecb                = "0.1"
cipher             = { version = "0.4", features = ["block-padding", "alloc"] }
md-5               = "0.10"
url                = { version = "2", features = ["serde"] }
once_cell          = "1.21"
openssl            = "0.10"
rand               = "0.9"
realfft            = "3"
ringbuf            = "0.4"
rustc-hash         = "2"
walkdir            = "2"
unicode-width      = "0.2"
comfy-table        = "7"
ratatui            = "0.29"
rodio              = { version = "0.22", default-features = false, features = ["playback", "symphonia-mpa", "symphonia-aac", "symphonia-isomp4", "symphonia-alac", "symphonia-aiff", "symphonia-adpcm", "symphonia-flac", "vorbis", "wav"] }
stream-download    = { version = "0.13", features = ["http", "reqwest-rustls"] }
reqwest            = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
clap               = { version = "4.5", features = ["derive"] }
qrcode             = "0.14"
serde              = { version = "1.0", features    = ["derive"] }
serde_json         = "1.0"
serde_path_to_error = "0.1"
signal-hook-tokio  = { version = "0.3", features    = ["futures-v0_3"] }
chrono             = { version = "0.4", default-features = false, features = ["clock"] }
strum              = "0.27"
strum_macros       = "0.27"
time               = "0.3"
typed-builder      = "0.20"
tokio              = { version = "1.45.1", features = ["full"] }
tokio-util         = { version = "0.7", features = ["codec", "io"] }
sea-orm = { version = "2.0.2", default-features = false, features = ["macros", "sqlx-sqlite", "runtime-tokio", "sqlite-use-returning-for-3_35"] }
sea-orm-migration = { version = "2.0.2", default-features = false, features = ["runtime-tokio", "sqlx-sqlite"] }
parking_lot       = "0.12"
arc-swap          = "1"
insta              = { version = "1", features = ["filters"] }
proptest           = "1"
assert_cmd         = "2"
predicates         = "3"
pretty_assertions  = "1"
tracing            = "0.1"
tracing-appender   = "0.2"
tracing-subscriber = { version = "0.3", features    = ["fmt", "local-time", "chrono", "env-filter"] }
urlqstring         = "0.3.5"
palette            = { version = "0.7", default-features = false, features = ["std"] }
kmeans_colors      = { version = "0.7", default-features = false, features = ["palette_color"] }
nucleo-matcher     = "0.3"
pinyin             = { version = "0.11", default-features = false, features = ["plain"] }
smallvec           = "1"


[workspace.lints.rust]
warnings    = "deny"
unsafe_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
panic                              = "deny"
unwrap_used                        = "deny"
expect_used                        = "deny"
indexing_slicing                   = "deny"
index_refutable_slice              = "deny"
as_conversions                     = "deny"
exit                               = "deny"
mem_forget                         = "deny"
map_err_ignore                     = "deny"
mutex_integer                      = "deny"
implicit_clone                     = "deny"
needless_pass_by_value             = "deny"
branches_sharing_code              = "deny"
mismatching_type_param_order       = "deny"
option_option                      = "deny"
wildcard_imports                   = "deny"
redundant_closure_for_method_calls = "deny"
uninlined_format_args              = "deny"
cloned_instead_of_copied           = "deny"
manual_let_else                    = "deny"
self_named_module_files            = "deny"
format_push_string                 = "deny"
if_same_then_else                  = "allow"
len_without_is_empty               = "allow"
missing_safety_doc                 = "deny"
module_inception                   = "allow"
use_self                           = "deny"
too_many_lines                     = "deny"
missing_docs_in_private_items      = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true
strip = false
