name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ALSA 开发头文件是**编译期**依赖:rodio/cpal 经 alsa-sys → pkg-config 链接
      # libasound,缺它 build 直接挂。AudioMode::Auto 在无输出设备时使用 null backend,
      # 因此 job 不需要运行期音频 sink。
      - name: 安装 ALSA 开发库
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: 安装最新 stable
        run: rustup toolchain install stable --component rustfmt --component clippy --no-self-update

      - name: 安装 Dylint nightly
        working-directory: tooling/lints
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tooling/lints -> target

      # nextest 作运行器(进程隔离 + daemon e2e 串行组,见 .config/nextest.toml)。
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,stylua

      - name: 安装 Dylint
        run: cargo install --locked cargo-dylint dylint-link

      - name: 完整检查
        run: scripts/check.sh
