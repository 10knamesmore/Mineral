name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "version x.y.z(etc 0.4.3)"
        required: true
        type: string
      headline:
        description: "tag / Release 标题的一句话(可空)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "版本号应为 x.y.z"; exit 1; }

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev cmake nasm

      - name: 安装最新 stable
        run: rustup toolchain install stable --component rustfmt --component clippy --no-self-update

      - name: 安装 Dylint nightly
        working-directory: tooling/lints
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mineral-check
          workspaces: |
            . -> target
            tooling/lints -> target

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,stylua,git-cliff

      - name: 安装 Dylint
        run: cargo install --locked --version 6.3.0 cargo-dylint dylint-link

      # —— 生成 CHANGELOG:只渲染上个 tag 之后的 feat/fix/perf,prepend,不动历史条目 ——
      - name: CHANGELOG
        env:
          VERSION: ${{ inputs.version }}
        run: git cliff --unreleased --tag "v${VERSION}" --prepend CHANGELOG.md

      # 同步 workspace 版本与内部依赖约束，保留第三方依赖的锁定版本。
      - name: bump version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i -E "s/^(version[[:space:]]*=[[:space:]]*\")[0-9]+\.[0-9]+\.[0-9]+(\")/\1${VERSION}\2/" Cargo.toml
          sed -i -E "/^mineral-/s/(version[[:space:]]*=[[:space:]]*\")[0-9]+\.[0-9]+\.[0-9]+(\")/\1${VERSION}\2/" Cargo.toml
          grep -E '^version' Cargo.toml
          cargo update --workspace

      - name: 完整检查
        env:
          CHECK_TOOLING: "1"
        run: scripts/check.sh

      # main 只快进；dev、main 与本次 tag 一起推送，任一引用被拒绝则全部不更新。
      - name: commit release + atomic push
        env:
          VERSION: ${{ inputs.version }}
          HEADLINE: ${{ inputs.headline }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): ${VERSION}"
          git checkout main
          git merge --ff-only dev
          MSG="Release ${VERSION}"
          [ -n "$HEADLINE" ] && MSG="${MSG}:${HEADLINE}"
          git tag -a "v${VERSION}" -m "$MSG"
          git push --atomic origin \
            refs/heads/dev:refs/heads/dev \
            refs/heads/main:refs/heads/main \
            "refs/tags/v${VERSION}:refs/tags/v${VERSION}"

      # —— GitHub Release:正文取 CHANGELOG 顶部那一版块 ——
      - name: GitHub Release
        env:
          VERSION: ${{ inputs.version }}
          HEADLINE: ${{ inputs.headline }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk '/^## \[/{c++} c==1' CHANGELOG.md > RELEASE_NOTES.md
          TITLE="v${VERSION}"
          [ -n "$HEADLINE" ] && TITLE="${TITLE} — ${HEADLINE}"
          gh release create "v${VERSION}" --title "$TITLE" --notes-file RELEASE_NOTES.md

  crates-publish:
    name: publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libssl-dev pkg-config cmake nasm

      - name: 安装最新 stable
        run: rustup toolchain install stable --no-self-update

      - uses: Swatinem/rust-cache@v2

      - name: 发布 workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --exclude mineral-test --registry crates-io --locked

      - name: 验证 crates.io 安装
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cargo install --locked --registry crates-io --version "=${VERSION}" --root "$RUNNER_TEMP/mineral-install" mineral
          "$RUNNER_TEMP/mineral-install/bin/mineral" --version

  # AUR 首推复用 aur-publish 工作流(pkgrel 按 AUR 现状自动:新版本 → 1)。
  aur-publish:
    needs: release
    uses: ./.github/workflows/aur-publish.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
